<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRM — Personal Relations Manager</title>
<meta name="theme-color" content="#0a1220">
<link rel="manifest" href="prm.webmanifest">
<style>
:root{
  --bg:#0a1220; --bg2:#0e1a2e; --card:#121f36; --card2:#182742;
  --line:#22355a; --line2:#2c4270;
  --txt:#e8effc; --txt-dim:#aebdd8; --txt-mute:#7487a8;
  --amber:#f5b74a; --amber2:#e09a1f; --navy:#2f6fd0; --navy2:#5590e8;
  --ok:#3ecf8e; --warn:#f5b74a; --danger:#ef5b5b; --watch:#5ea8f5;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy2)}
input[type=file]{padding:7px}
input[type=date]{color-scheme:dark}
label{font-size:.78rem;font-weight:600;color:var(--txt-dim);display:block;margin-bottom:5px;letter-spacing:.3px}
.field{margin-bottom:13px}
.hint{font-size:.72rem;color:var(--txt-mute);margin-top:4px;line-height:1.4}
h2{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.sheet-sub{font-size:.8rem;color:var(--txt-mute);margin-bottom:14px}

/* ---- App shell ---- */
#app{max-width:760px;margin:0 auto;padding:14px 14px 88px}
.apphead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.apphead .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--amber2));display:grid;place-items:center;font-weight:900;color:#221503;font-size:1.05rem;flex:0 0 auto}
.apphead h1{font-size:1.25rem;font-weight:900;letter-spacing:.2px}
.apphead .sub{font-size:.7rem;color:var(--txt-mute);letter-spacing:.5px;text-transform:uppercase}
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{padding-left:36px;border-radius:999px;background:var(--card)}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--txt-mute)}

/* ---- Bottom nav ---- */
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:500;background:rgba(10,18,32,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;max-width:760px;margin:0 auto}
#bnav button{flex:1;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.64rem;font-weight:700;color:var(--txt-mute);letter-spacing:.3px}
#bnav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
#bnav button.active{color:var(--amber)}

/* ---- Cards / rows ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--txt-dim);margin-bottom:10px}
.card-h svg{width:15px;height:15px;stroke:var(--amber);fill:none;stroke-width:2}
.crow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.crow:hover{background:var(--card2)}
.crow:active{background:var(--card2)}
.ava{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.95rem;color:#08111f;flex:0 0 auto;overflow:hidden;background:linear-gradient(135deg,var(--navy2),var(--navy))}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.sm{width:30px;height:30px;border-radius:9px;font-size:.72rem}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:.72rem;color:var(--txt-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.alpha-h{font-size:.72rem;font-weight:800;color:var(--amber);padding:9px 4px 3px;letter-spacing:1px}
.pin-ic{color:var(--amber);flex:0 0 auto}

/* ---- Pinned strip ---- */
.pinstrip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.pinstrip::-webkit-scrollbar{display:none}
.pincell{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex:0 0 auto;width:62px}
.pincell .ava{width:52px;height:52px;border-radius:16px}
.pincell span{font-size:.66rem;font-weight:600;color:var(--txt-dim);max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- Upcoming strip ---- */
.uprow{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;border-left:3px solid transparent;margin-bottom:5px;background:var(--bg2)}
.uprow:hover{background:var(--card2)}
.upd{font-size:.68rem;font-weight:800;min-width:58px;text-align:center;padding:4px 6px;border-radius:7px;flex:0 0 auto}
.uptxt{flex:1;min-width:0;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upsub{font-size:.66rem;color:var(--txt-mute)}
.t-expired{border-left-color:var(--danger)} .t-expired .upd{background:#42171c;color:#ff9d9d}
.t-amber{border-left-color:var(--warn)} .t-amber .upd{background:#3d2e0e;color:#ffd98a}
.t-watch{border-left-color:var(--watch)} .t-watch .upd{background:#12304f;color:#a6d2ff}
.t-soon{border-left-color:var(--ok)} .t-soon .upd{background:#0e3a2a;color:#8af0c6}
.t-appt{border-left-color:#b58af0} .t-appt .upd{background:#2c1d4a;color:#d6bafc}

/* ---- Chips ---- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 13px;border-radius:999px;border:1px solid var(--line2);font-size:.74rem;font-weight:700;color:var(--txt-dim);background:var(--card)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#221503}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;font-weight:700;font-size:.86rem;letter-spacing:.2px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn-primary{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#221503}
.btn-accent{background:var(--navy);color:#fff}
.btn-ghost{background:var(--card2);border:1px solid var(--line2);color:var(--txt)}
.btn-danger{background:#4a1a1f;border:1px solid #7a2c33;color:#ff9d9d}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:.76rem;border-radius:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line2);flex:0 0 auto}
.icon-btn svg{width:16px;height:16px;stroke:var(--txt-dim);fill:none;stroke-width:2}
#fab{position:fixed;right:18px;bottom:72px;z-index:490;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--amber),var(--amber2));color:#221503;font-size:1.7rem;font-weight:800;box-shadow:0 8px 22px rgba(245,183,74,.35);display:grid;place-items:center}

/* ---- Sheet ---- */
#sheetBack{position:fixed;inset:0;background:rgba(4,8,16,.72);z-index:900;display:none}
#sheetBack.open{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;top:6vh;z-index:901;background:var(--bg2);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;max-width:760px;margin:0 auto;display:none;flex-direction:column}
#sheet.open{display:flex}
#sheetGrip{padding:10px 0 4px;display:grid;place-items:center;flex:0 0 auto}
#sheetGrip i{width:44px;height:4px;border-radius:3px;background:var(--line2);display:block}
#sheetBody{overflow-y:auto;padding:8px 18px 30px;flex:1}
.sheet-x{position:absolute;right:12px;top:12px;z-index:5}

/* ---- Profile ---- */
.prof-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.prof-head .ava{width:62px;height:62px;border-radius:18px;font-size:1.3rem}
.pn{font-size:1.25rem;font-weight:900;line-height:1.15}
.pr{font-size:.75rem;color:var(--txt-mute);margin-top:3px}
.gtag{display:inline-block;font-size:.64rem;font-weight:800;padding:2px 9px;border-radius:6px;margin:2px 4px 0 0;color:#08111f}
.qacts{display:flex;gap:9px;margin:10px 0 4px}
.qacts a{flex:1;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--txt-dim);font-size:.66rem;font-weight:700}
.qacts a svg{width:17px;height:17px;stroke:var(--amber);fill:none;stroke-width:2}
.ptabs{display:flex;gap:4px;overflow-x:auto;margin:12px 0;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:8px}
.ptabs::-webkit-scrollbar{display:none}
.ptab{padding:7px 13px;border-radius:9px;font-size:.76rem;font-weight:700;color:var(--txt-mute);white-space:nowrap;flex:0 0 auto}
.ptab.active{background:var(--card2);color:var(--amber)}
.ptab .pill{display:inline-block;margin-left:5px;font-size:.62rem;background:var(--line);border-radius:8px;padding:1px 6px;color:var(--txt-dim)}
.inf-row{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:.86rem;align-items:baseline}
.inf-row b{flex:0 0 118px;font-size:.72rem;color:var(--txt-mute);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.inf-row span{flex:1;word-break:break-word}
.note-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.note-card.newest{border-color:var(--amber);background:linear-gradient(180deg,#1c2436,var(--card))}
.note-ts{font-size:.64rem;color:var(--txt-mute);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.note-tx{font-size:.86rem;white-space:pre-wrap;line-height:1.5}
.mini-del{color:var(--txt-mute);font-size:.72rem;padding:2px 6px}
.mini-del:hover{color:var(--danger)}
.prom-row{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.prom-row input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin-top:2px;accent-color:var(--amber)}
.prom-tx{flex:1;font-size:.86rem}
.prom-tx.done{color:var(--txt-mute);text-decoration:line-through}
.prom-ts{font-size:.64rem;color:var(--txt-mute)}

/* ---- Docs / files ---- */
.file-row{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;background:var(--card)}
.file-thumb{width:44px;height:44px;border-radius:10px;background:var(--card2);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;font-size:.6rem;font-weight:800;color:var(--txt-dim)}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-info{flex:1;min-width:0}
.file-name{font-size:.84rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:.66rem;color:var(--txt-mute);margin-top:1px}
.file-acts{display:flex;gap:5px}
.tier-badge{display:inline-block;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.3px}
.tb-expired{background:#42171c;color:#ff9d9d} .tb-amber{background:#3d2e0e;color:#ffd98a}
.tb-watch{background:#12304f;color:#a6d2ff} .tb-ok{background:#0e3a2a;color:#8af0c6}
.photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photo-strip .ph{width:64px;height:64px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line2)}
.photo-strip .ph img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.photo-strip .ph button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.65rem;line-height:1;display:grid;place-items:center}
.dyn-row{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.dyn-row input,.dyn-row select{margin:0}
.dyn-row .rm{flex:0 0 30px;height:38px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);color:var(--txt-mute)}
.addline{font-size:.76rem;font-weight:700;color:var(--navy2);padding:4px 2px}

/* ---- Lightbox ---- */
#lightbox{position:fixed;inset:0;z-index:1200;background:rgba(2,5,10,.93);display:none;place-items:center;padding:20px}
#lightbox.open{display:grid}
#lightbox img{max-width:100%;max-height:92vh;border-radius:10px}

/* ---- Toast ---- */
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);z-index:1500;background:#1b2d4d;border:1px solid var(--line2);color:var(--txt);padding:10px 18px;border-radius:11px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#4a1a1f;border-color:#7a2c33;color:#ffb3b3}
#toast.ok{background:#0e3a2a;border-color:#1d6a4d;color:#a9f2d3}

/* ---- Report cards (Reports view) ---- */
.rep-card{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.rep-card:hover{background:var(--card2)}
.rep-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.rep-ic svg{width:20px;height:20px;fill:none;stroke-width:2}
.rep-t{font-weight:800;font-size:.92rem}
.rep-s{font-size:.7rem;color:var(--txt-mute);margin-top:2px}

/* ---- PRINT PREVIEW (in-page; window.print() only on button) ---- */
#printWrap{position:fixed;inset:0;z-index:2000;background:#3a4356;display:none;flex-direction:column}
#printWrap.open{display:flex}
#printBar{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#0a1220;border-bottom:1px solid var(--line)}
#printBar .sp{flex:1}
#printScroll{flex:1;overflow:auto;padding:24px 10px}
.pp{background:#fff;color:#182338;max-width:820px;margin:0 auto 24px;padding:34px 40px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:.86rem;line-height:1.5}
.pp h1{font-size:1.5rem;color:#0b1c3a;margin-bottom:2px;font-weight:900}
.pp .pp-sub{font-size:.72rem;color:#6a7a95;margin-bottom:18px;letter-spacing:.4px;text-transform:uppercase;font-weight:700}
.pp h3{font-size:.8rem;color:#0b1c3a;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid #f5b74a;padding-bottom:4px}
.pp table{width:100%;border-collapse:collapse;margin:6px 0 10px}
.pp th{font-size:.66rem;text-transform:uppercase;letter-spacing:.4px;color:#5a6b85;text-align:left;padding:6px 8px;border-bottom:2px solid #dbe4f0;background:#f4f8fd}
.pp td{padding:6px 8px;border-bottom:1px solid #e8eef6;vertical-align:top}
.pp .kv{display:flex;gap:8px;padding:4px 0;border-bottom:1px dotted #dfe7f1}
.pp .kv b{flex:0 0 170px;font-size:.7rem;text-transform:uppercase;color:#5a6b85;letter-spacing:.4px}
.pp .pt{display:inline-block;font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:5px}
.pt-expired{background:#fee2e2;color:#991b1b}.pt-amber{background:#fef3c7;color:#92600a}
.pt-watch{background:#dbeafe;color:#1e40af}.pt-ok{background:#d1fae5;color:#065f46}
.pp .pp-hero{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:10px;background:linear-gradient(135deg,#0b1c3a,#274b86);color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.pp .pp-hero .hava{width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:900;font-size:1.3rem;overflow:hidden;flex:0 0 auto}
.pp .pp-hero .hava img{width:100%;height:100%;object-fit:cover}
.pp .pp-hero .hn{font-size:1.35rem;font-weight:900}
.pp .pp-hero .hs{font-size:.74rem;opacity:.85;margin-top:3px}
.pp .wmark{position:absolute;right:-14px;bottom:-24px;width:130px;height:130px;opacity:.14;border-radius:20px;overflow:hidden}
.pp .wmark img{width:100%;height:100%;object-fit:cover}
.pp .pp-foot{margin-top:26px;padding-top:12px;border-top:1px solid #e3e9f2;font-size:.66rem;color:#8a97ad;display:flex;justify-content:space-between}
.pp .em-band{background:#b91c1c;color:#fff;font-weight:900;text-align:center;letter-spacing:2px;padding:7px;border-radius:6px;margin-bottom:14px;font-size:.8rem}
/* ---- AMOLED pure-black theme ---- */
body.amoled{--bg:#000;--bg2:#000;--card:#0a0a0a;--card2:#151515;--line:#1f1f1f;--line2:#2c2c2c;background:#000}
body.amoled #bnav{background:rgba(0,0,0,.97)}
body.amoled #sheet{background:#050505}
body.amoled .uprow{background:#0d0d0d}
body.amoled .searchwrap input{background:#0a0a0a}
body.amoled #toast{background:#151515;border-color:#2c2c2c}
body.amoled #fab{box-shadow:0 8px 22px rgba(245,183,74,.25)}

@media print{
  body>*{display:none!important}
  body>#printWrap{display:block!important;position:static;background:#fff}
  #printBar{display:none!important}
  #printScroll{overflow:visible;padding:0}
  .pp{box-shadow:none;border-radius:0;margin:0;max-width:none;padding:10mm 12mm;page-break-after:always}
  #suiteHome{display:none!important}
}
@media (max-width:520px){
  .pp{padding:22px 18px}
  .inf-row b{flex-basis:96px}
}
</style>
</head>
<body>
<div id="app">
  <div class="apphead">
    <div class="logo">PR</div>
    <div><h1>Relations</h1><div class="sub">People · Dates · Documents</div></div>
  </div>

  <div id="view-home">
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search people, notes, documents…" oninput="renderHome()">
    </div>
    <div id="pinnedWrap"></div>
    <div id="upcomingWrap"></div>
    <div id="groupChips" class="chips"></div>
    <div id="contactList"></div>
  </div>

  <div id="view-groups" style="display:none"><div id="groupsArea"></div></div>
  <div id="view-reports" style="display:none"><div id="reportsArea"></div></div>
  <div id="view-settings" style="display:none"><div id="settingsArea"></div></div>
</div>

<button id="fab" title="Add contact" onclick="openContactForm()">+</button>

<div id="bnav">
  <button id="nav-home" class="active" onclick="nav('home')"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>People</button>
  <button id="nav-groups" onclick="nav('groups')"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Groups</button>
  <button id="nav-reports" onclick="nav('reports')"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>Reports</button>

<script>
/* ============================================================
   PRM — Personal Relations Manager · Ship Suite module
   Single-file, offline-first. Namespace: prm
   ============================================================ */
'use strict';

/* ===== Ship Suite desktop bridge (40ms polling — iframe-safe) ===== */
var SUITE_NS='prm';
var DESK=null, IS_DESK=false;
var DESK_READY=new Promise(function(res){
  function up(){DESK=window.pywebview.api;IS_DESK=true;res(true);}
  if(window.pywebview&&window.pywebview.api)return up();
  var n=0;
  var iv=setInterval(function(){
    if(window.pywebview&&window.pywebview.api){clearInterval(iv);up();}
    else if(++n>=23){clearInterval(iv);res(false);}
  },40);
  window.addEventListener('pywebviewready',function(){if(!IS_DESK&&window.pywebview&&window.pywebview.api){clearInterval(iv);up();}},{once:true});
});
function suiteHomeBtn(){
  if(!IS_DESK)return;
  var st=document.createElement('style');
  st.textContent='#suiteHome{position:fixed;left:12px;bottom:56px;z-index:99990;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(10,18,32,.88);color:#cfe0ff;font:600 12px/1 system-ui,sans-serif;letter-spacing:.4px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}#suiteHome:hover{background:rgba(20,34,58,.95)}@media print{#suiteHome{display:none!important}}';
  document.head.appendChild(st);
  var b=document.createElement('button');b.id='suiteHome';b.type='button';b.title='Ship Suite home';
  b.textContent='\u2302 Suite';
  b.onclick=function(){location.href='index.html';};
  document.body.appendChild(b);
}

/* ===== Utils ===== */
const LS_KEY='prm_state_v1';
const IDB_NAME='prm_media_v1', IDB_STORE='media';
const COLL=['contacts','groups','dates','notes','promises','meds','appts','docs','links','places'];
const IS_MOBILE=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
function $(id){return document.getElementById(id);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function now(){return Date.now();}
function nowIso(){return new Date().toISOString();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayMid(){const d=new Date();d.setHours(0,0,0,0);return d;}
function parseDate(s){if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3]);}
function fmtDate(s){const d=parseDate(s);if(!d)return '—';return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear();}
function fmtDM(s){const d=parseDate(s);if(!d)return '—';return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];}
function daysUntil(s){const d=parseDate(s);if(!d)return null;return Math.round((d-todayMid())/86400000);}
function ageFrom(dob){const d=parseDate(dob);if(!d)return null;const t=new Date();let a=t.getFullYear()-d.getFullYear();const m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a;}
function nextOccurrence(s){ // next yearly occurrence of month/day in s → {date:Date,days:int}
  const d=parseDate(s);if(!d)return null;
  const t=todayMid();let occ=new Date(t.getFullYear(),d.getMonth(),d.getDate());
  if(occ<t)occ=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());
  return {date:occ,days:Math.round((occ-t)/86400000)};
}
function tierFor(days){if(days==null)return null;if(days<0)return 'expired';if(days<=30)return 'amber';if(days<=90)return 'watch';return 'ok';}
function tierLabel(days){if(days==null)return '';if(days<0)return Math.abs(days)+'d ago';if(days===0)return 'TODAY';if(days===1)return 'Tomorrow';return 'in '+days+'d';}
function normPhone(s){const d=String(s||'').replace(/\D/g,'');return d.length>10?d.slice(-10):d;}
function placeNavUrls(q){
  q=(q||'').trim();
  if(/^https?:\/\//i.test(q))return {open:q,nav:q};
  const enc=encodeURIComponent(q);
  return {open:'https://www.google.com/maps/search/?api=1&query='+enc,
          nav:'https://www.google.com/maps/dir/?api=1&destination='+enc+'&travelmode=driving'};
}
function openExt(url){
  if(IS_DESK&&DESK&&DESK.open_external){DESK.open_external(url).catch(()=>window.open(url,'_blank'));}
  else window.open(url,'_blank','noopener');
}
async function sharePlace(label,q){
  const u=placeNavUrls(q).open;
  if(navigator.share){try{await navigator.share({title:label,text:label,url:u});return;}catch(e){}}
  try{await navigator.clipboard.writeText(u);toast('Map link copied','ok');}
  catch(e){toast(u.length>60?'Link: '+u.slice(0,60)+'\u2026':u);}
}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function nameHue(n){let h=0;for(const c of String(n||''))h=(h*31+c.charCodeAt(0))%360;return h;}
function avaStyle(c){return 'background:linear-gradient(135deg,hsl('+nameHue(c.name)+',62%,66%),hsl('+((nameHue(c.name)+40)%360)+',62%,46%))';}
function bytesNice(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(0)+' KB';return (b/1048576).toFixed(1)+' MB';}
let toastT=null;
function toast(msg,kind){const t=$('toast');t.textContent=msg;t.className=kind||'';t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}

/* ===== State ===== */
function blankState(){return {schemaVersion:1,contacts:[],groups:[],dates:[],notes:[],promises:[],meds:[],appts:[],docs:[],links:[],places:[],settings:{photoMaxKB:200}};}
let state=blankState();
async function loadState(){
  await DESK_READY;
  try{
    const raw=IS_DESK?await DESK.kv_get(SUITE_NS,'state'):localStorage.getItem(LS_KEY);
    if(raw){const p=typeof raw==='string'?JSON.parse(raw):raw;if(p&&p.contacts)state=Object.assign(blankState(),p);}
  }catch(e){console.warn('state load failed',e);}
  COLL.forEach(k=>{if(!Array.isArray(state[k]))state[k]=[];});
  if(!state.settings)state.settings={photoMaxKB:200};
}
function save(){
  try{
    const j=JSON.stringify(state);
    if(IS_DESK){DESK.kv_set(SUITE_NS,'state',j).then(r=>{if(!(r&&r.ok!==false));}).catch(()=>toast('Save failed — disk error','err'));}
    else localStorage.setItem(LS_KEY,j);
  }catch(e){toast('Save failed — storage unavailable','err');}
}
function alive(arr){return (arr||[]).filter(r=>!r.deleted);}
function byId(arr,id){return (arr||[]).find(r=>r.id===id);}
function contactOf(id){return byId(state.contacts,id);}
function touch(rec){rec.modified=now();return rec;}

/* ===== IndexedDB media (write durability: resolve on tx completion) ===== */
let _idb=null;
function idb(){
  if(_idb)return Promise.resolve(_idb);
  return new Promise((res,rej)=>{
    const rq=indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        const st=db.createObjectStore(IDB_STORE,{keyPath:'id'});
        st.createIndex('contact','contactId',{unique:false});
      }
    };
    rq.onsuccess=e=>{_idb=e.target.result;res(_idb);};
    rq.onerror=()=>rej(rq.error);
  });
}
function idbPut(rec){if(IS_DESK)return DESK.media_put(SUITE_NS,rec).then(()=>{});return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}));}
function idbDel(id){if(IS_DESK)return DESK.media_del(SUITE_NS,id).then(()=>{});return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}));}
function idbGet(id){
  if(IS_DESK)return DESK.media_get?DESK.media_get(SUITE_NS,id):DESK.media_all(SUITE_NS).then(a=>(a||[]).find(m=>m.id===id)||null);
  return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);}));
}
function idbAll(){if(IS_DESK)return DESK.media_all(SUITE_NS).then(a=>a||[]);return idb().then(db=>new Promise((res,rej)=>{const out=[];const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).openCursor();rq.onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue();}else res(out);};rq.onerror=()=>rej(rq.error);}));}
function idbClearAll(){if(IS_DESK)return DESK.media_clear(SUITE_NS).then(()=>{});return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}));}
const mediaCache={};
async function mediaUrl(id){
  if(!id)return null;
  if(mediaCache[id]!==undefined)return mediaCache[id];
  const m=await idbGet(id).catch(()=>null);
  mediaCache[id]=m?m.dataUrl:null;
  return mediaCache[id];
}

/* ===== Image compression (photoMaxKB target) ===== */
function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file);});}
function compressImage(dataUrl,maxKB){
  maxKB=maxKB||state.settings.photoMaxKB||200;
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      const maxSide=1400;
      if(Math.max(w,h)>maxSide){const k=maxSide/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      const cv=document.createElement('canvas');
      let q=0.85,out=dataUrl;
      for(let i=0;i<7;i++){
        cv.width=w;cv.height=h;
        const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
        out=cv.toDataURL('image/jpeg',q);
        if(out.length<=maxKB*1024*1.37)break;
        if(q>0.45)q-=0.12;else{w=Math.round(w*0.82);h=Math.round(h*0.82);}
      }
      res(out);
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

/* ===== Attachment rules ===== */
const VIDEO_EXT=['mp4','mkv','avi','mov','webm','wmv','flv','3gp','m4v','mpg','mpeg'];
const MAX_FILE_MB=5;
function attachmentCheck(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if((file.type||'').startsWith('video/')||VIDEO_EXT.includes(ext))
    return 'Videos aren\u2019t stored in PRM \u2014 they belong on your pen drive, not in the database.';
  if(!(file.type||'').startsWith('image/') && file.size>MAX_FILE_MB*1048576)
    return 'File over '+MAX_FILE_MB+' MB \u2014 large files belong on your pen drive, not in the database.';
  return null;
}

/* ===== Merge engine (add-if-new · newest-modified wins · soft deletes propagate) ===== */
function mergeCollections(incoming){
  let added=0,updated=0;
  COLL.forEach(k=>{
    const inc=incoming[k]||[];
    const cur={};(state[k]||[]).forEach(r=>{if(r.id)cur[r.id]=r;});
    inc.forEach(r=>{
      if(!r||!r.id)return;
      if(typeof r.deleted!=='boolean')r.deleted=false;
      if(!r.modified)r.modified=0;
      const ex=cur[r.id];
      if(!ex){state[k].push(r);cur[r.id]=r;added++;}
      else if((r.modified||0)>(ex.modified||0)){Object.assign(ex,r);updated++;}
    });
  });
  return {added,updated};
}
function mergeMedia(media){
  if(!Array.isArray(media)||!media.length)return Promise.resolve(0);
  let n=0;
  return Promise.all(media.map(m=>{
    if(!m||!m.id)return Promise.resolve();
    return idbGet(m.id).then(ex=>ex?null:idbPut(m).then(()=>{n++;})).catch(()=>{});
  })).then(()=>n);
}
async function importPayload(data){
  if(!data)return null;
  const body=data.data&&data.data.contacts?data.data:(data.contacts?data:null);
  if(!body)return null;
  if((data.schemaVersion||body.schemaVersion||1)>1){toast('Backup from a newer PRM version \u2014 update the app first','err');return null;}
  const rep=mergeCollections(body);
  const mAdded=await mergeMedia(data.media||body.media).catch(()=>0);
  save();renderAll();
  return {added:rep.added,updated:rep.updated,media:mAdded};
}

/* ===== Export ===== */
async function buildExport(withMedia){
  const data={app:'PRM',schemaVersion:1,exportedAt:nowIso(),data:{}};
  COLL.forEach(k=>data.data[k]=state[k]);
  data.data.settings=state.settings;
  if(withMedia)data.media=await idbAll().catch(()=>[]);
  return data;
}
function downloadJson(obj,fname){
  const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function exportJson(withMedia){
  const data=await buildExport(withMedia);
  downloadJson(data,'PRM_backup_'+new Date().toISOString().slice(0,10)+(withMedia?'_with_files':'')+'.json');
  toast('Backup exported','ok');
}

/* ===== SUITE bridge (launcher master backup/restore) ===== */
window.SUITE={
  async export(){return await buildExport(true);},
  async importMerge(data){
    const rep=await importPayload(data);
    if(!rep)return null;
    return {added:rep.added,updated:rep.updated,kept:0};
  },
  async size(){
    let bytes=0;
    try{bytes=new Blob([JSON.stringify(state)]).size;}catch(e){bytes=JSON.stringify(state).length;}
    try{(await idbAll().catch(()=>[])).forEach(m=>{try{bytes+=new Blob([m.dataUrl||'']).size;}catch(e){}});}catch(e){}
    return {bytes:bytes,records:alive(state.contacts).length};
  }
};
</script>
<script>
/* ===== Navigation ===== */
let currentView='home', activeGroupFilter='';
function nav(v,noGuard){
  currentView=v;
  ['home','groups','reports','settings'].forEach(x=>{
    $('view-'+x).style.display=x===v?'':'none';
    $('nav-'+x).classList.toggle('active',x===v);
  });
  $('fab').style.display=v==='home'?'grid':'none';
  if(v==='home')renderHome();
  if(v==='groups')renderGroups();
  if(v==='reports')renderReports();
  if(v==='settings')renderSettings();
  if(!noGuard)ensureGuard();
}
function renderAll(){nav(currentView,true);}

/* ===== Upcoming events engine ===== */
function upcomingEvents(){
  const ev=[];
  const cname=id=>{const c=contactOf(id);return c&&!c.deleted?c.name:null;};
  // documents with expiry
  alive(state.docs).forEach(d=>{
    if(!d.expiry)return;const nm=cname(d.contactId);if(!nm)return;
    const days=daysUntil(d.expiry);
    const horizon=Math.max(90,d.remindDays||0);
    if(days<=horizon){ev.push({days,tier:'t-'+tierFor(days),label:nm+' \u00b7 '+(d.title||'Document'),sub:(d.dtype||'Document')+' \u2014 '+(days<0?'EXPIRED '+fmtDate(d.expiry):'expires '+fmtDate(d.expiry)),contactId:d.contactId});}
  });
  // custom dates
  alive(state.dates).forEach(dt=>{
    const nm=cname(dt.contactId);if(!nm)return;
    if(dt.recurring){
      const occ=nextOccurrence(dt.date);if(!occ)return;
      if(occ.days<=(dt.remindDays||7))ev.push({days:occ.days,tier:'t-soon',label:nm+' \u00b7 '+dt.label,sub:fmtDM(dt.date)+' every year',contactId:dt.contactId});
    }else{
      const days=daysUntil(dt.date);if(days==null)return;
      const horizon=Math.max(90,dt.remindDays||0);
      if(days<=horizon)ev.push({days,tier:'t-'+tierFor(days),label:nm+' \u00b7 '+dt.label,sub:days<0?'PASSED '+fmtDate(dt.date):'due '+fmtDate(dt.date),contactId:dt.contactId});
    }
  });
  // birthdays from DOB
  alive(state.contacts).forEach(c=>{
    if(!c.dob)return;const occ=nextOccurrence(c.dob);if(!occ)return;
    if(occ.days<=7){const turning=(occ.date.getFullYear()-parseDate(c.dob).getFullYear());
      ev.push({days:occ.days,tier:'t-soon',label:c.name+' \u00b7 Birthday \ud83c\udf82',sub:fmtDM(c.dob)+' \u2014 turns '+turning,contactId:c.id});}
  });
  // appointments (next 30 days)
  alive(state.appts).forEach(a=>{
    const nm=cname(a.contactId);if(!nm)return;
    const days=daysUntil(a.date);if(days==null||days<0||days>30)return;
    ev.push({days,tier:'t-appt',label:nm+' \u00b7 '+(a.purpose||'Appointment'),sub:(a.doctor?a.doctor+' \u2014 ':'')+fmtDate(a.date)+(a.time?' '+a.time:''),contactId:a.contactId});
  });
  ev.sort((a,b)=>a.days-b.days);
  return ev;
}

/* ===== Search ===== */
function contactMatches(c,q){
  if((c.name||'').toLowerCase().includes(q))return true;
  const qd=q.replace(/\D/g,'');
  if(qd&&(c.phones||[]).some(p=>String(p.number||'').replace(/\D/g,'').includes(qd)))return true;
  if((c.phones||[]).some(p=>String(p.number||'').toLowerCase().includes(q)))return true;
  if((c.emails||[]).some(e=>String(e).toLowerCase().includes(q)))return true;
  if((c.address||'').toLowerCase().includes(q))return true;
  if((c.custom||[]).some(f=>((f.k||'')+' '+(f.v||'')).toLowerCase().includes(q)))return true;
  if(alive(state.notes).some(n=>n.contactId===c.id&&(n.text||'').toLowerCase().includes(q)))return true;
  if(alive(state.docs).some(d=>d.contactId===c.id&&((d.title||'')+' '+(d.dtype||'')).toLowerCase().includes(q)))return true;
  if(alive(state.promises).some(p=>p.contactId===c.id&&(p.text||'').toLowerCase().includes(q)))return true;
  if(alive(state.places).some(p=>p.contactId===c.id&&((p.label||'')+' '+(p.query||'')+' '+(p.note||'')).toLowerCase().includes(q)))return true;
  return false;
}

/* ===== Home render ===== */
function groupTag(g){return '<span class="gtag" style="background:'+g.color+'">'+esc(g.name)+'</span>';}
function contactRowHtml(c){
  const gs=(c.groupIds||[]).map(id=>byId(state.groups,id)).filter(g=>g&&!g.deleted);
  const bits=[];
  const ph=(c.phones||[])[0];if(ph)bits.push(esc(ph.number));
  if(c.dob){const a=ageFrom(c.dob);if(a!=null)bits.push(a+' yrs');}
  if(gs.length)bits.push(gs.map(g=>esc(g.name)).join(', '));
  return '<div class="crow" onclick="viewContact(\''+c.id+'\')">'
    +'<div class="ava" data-photo="'+(c.photoId||'')+'" style="'+avaStyle(c)+'">'+esc(initials(c.name))+'</div>'
    +'<div class="cinfo"><div class="cname">'+esc(c.name)+'</div><div class="cmeta">'+(bits.join(' \u00b7 ')||'\u2014')+'</div></div>'
    +(c.pinned?'<svg class="pin-ic" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2l2.9 6.6 6.6.6-5 4.4 1.5 6.4L12 16.9 6 20l1.5-6.4-5-4.4 6.6-.6z"/></svg>':'')
    +'</div>';
}
async function fillAvatars(root){
  const els=(root||document).querySelectorAll('[data-photo]');
  for(const el of els){
    const id=el.getAttribute('data-photo');if(!id)continue;
    const url=await mediaUrl(id);
    if(url)el.innerHTML='<img src="'+url+'" alt="">';
  }
}
function renderHome(){
  const q=($('q').value||'').trim().toLowerCase();
  const all=alive(state.contacts);
  // pinned
  const pins=all.filter(c=>c.pinned);
  $('pinnedWrap').innerHTML=(!q&&pins.length)?
    '<div class="card" style="padding:11px 12px 6px"><div class="card-h"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 6.6.6-5 4.4 1.5 6.4L12 16.9 6 20l1.5-6.4-5-4.4 6.6-.6z"/></svg>Pinned</div>'
    +'<div class="pinstrip">'+pins.map(c=>'<div class="pincell" onclick="viewContact(\''+c.id+'\')"><div class="ava" data-photo="'+(c.photoId||'')+'" style="'+avaStyle(c)+'">'+esc(initials(c.name))+'</div><span>'+esc(c.name.split(' ')[0])+'</span></div>').join('')+'</div></div>':'';
  // upcoming
  const ev=q?[]:upcomingEvents();
  $('upcomingWrap').innerHTML=ev.length?
    '<div class="card" style="padding:11px 12px 8px"><div class="card-h"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Upcoming <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--txt-mute)">\u00b7 '+ev.length+'</span></div>'
    +ev.slice(0,12).map(e=>'<div class="uprow '+e.tier+'" onclick="viewContact(\''+e.contactId+'\')"><div class="upd">'+tierLabel(e.days)+'</div><div style="flex:1;min-width:0"><div class="uptxt">'+e.label+'</div><div class="upsub">'+e.sub+'</div></div></div>').join('')
    +(ev.length>12?'<div class="hint" style="text-align:center;padding:4px">+'+(ev.length-12)+' more in Reports \u2192 Expiry register</div>':'')+'</div>':'';
  // group chips
  const gs=alive(state.groups);
  $('groupChips').innerHTML=gs.length?'<button class="chip'+(activeGroupFilter?'':' on')+'" onclick="setGroupFilter(\'\')">All</button>'
    +gs.map(g=>'<button class="chip'+(activeGroupFilter===g.id?' on':'')+'" onclick="setGroupFilter(\''+g.id+'\')"><span class="gdot" style="background:'+g.color+'"></span>'+esc(g.name)+'</button>').join(''):'';
  // list
  let list=all;
  if(activeGroupFilter)list=list.filter(c=>(c.groupIds||[]).includes(activeGroupFilter));
  if(q)list=list.filter(c=>contactMatches(c,q));
  list.sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){
    $('contactList').innerHTML='<div class="card" style="text-align:center;color:var(--txt-mute);padding:28px">'+(all.length?'No matches.':'No contacts yet.<br><br>Tap <b style="color:var(--amber)">+</b> to add one, or import your phone contacts (.vcf) from Settings.')+'</div>';
  }else{
    let html='',letter='';
    list.forEach(c=>{
      const L=(c.name[0]||'#').toUpperCase();
      if(!q&&L!==letter){letter=L;html+='<div class="alpha-h">'+esc(L)+'</div>';}
      html+=contactRowHtml(c);
    });
    $('contactList').innerHTML=html;
  }
  fillAvatars($('view-home'));
}
function setGroupFilter(id){activeGroupFilter=id;renderHome();}
</script>
<script>
/* ===== Sheet ===== */
function openSheet(html){$('sheetBody').innerHTML=html;$('sheet').classList.add('open');$('sheetBack').classList.add('open');$('sheetBody').scrollTop=0;ensureGuard();}
function closeSheet(){$('sheet').classList.remove('open');$('sheetBack').classList.remove('open');discardStaged();}
function sheetOpen(){return $('sheet').classList.contains('open');}
function showLightbox(url){$('lightImg').src=url;$('lightbox').classList.add('open');}

/* ===== Record attachments (notes / promises / medical) ===== */
let attCtx=null;      // {coll,id} target when attaching to an existing record
let stagedAtts=[];    // staged files for the note composer
function attachTo(coll,id){attCtx={coll,id};$('attFile').value='';$('attFile').click();}
function attachStage(){attCtx=null;$('attFile').value='';$('attFile').click();}
async function processAttFiles(files){
  const out=[];
  for(const f of files){
    const err=attachmentCheck(f);
    if(err){toast(err,'err');continue;}
    let dataUrl=await fileToDataUrl(f);
    let mime=f.type||'application/octet-stream';
    if(mime.startsWith('image/')){dataUrl=await compressImage(dataUrl);mime='image/jpeg';}
    const mid=uid();
    await idbPut({id:mid,contactId:curId,kind:'att',dataUrl,mime,name:f.name,ts:now()});
    mediaCache[mid]=dataUrl;
    out.push({mediaId:mid,mime,name:f.name});
  }
  return out;
}
async function handleAttFiles(files){
  const atts=await processAttFiles(files);
  if(!atts.length)return;
  if(attCtx){
    const rec=byId(state[attCtx.coll],attCtx.id);
    if(rec){rec.atts=(rec.atts||[]).concat(atts);touch(rec);save();}
    attCtx=null;
  }else{
    stagedAtts=stagedAtts.concat(atts);
  }
  renderTab();
  toast(atts.length+' file'+(atts.length===1?'':'s')+' attached','ok');
}
function attCell(a,delJs){
  return a.mime.startsWith('image/')
    ?'<div class="ph"><img data-att="'+a.mediaId+'" onclick="viewAtt(\''+a.mediaId+'\',\''+a.mime+'\',\''+esc(a.name)+'\')" alt=""><button onclick="'+delJs+'">\u00d7</button></div>'
    :'<div class="ph" style="width:auto;min-width:64px"><div style="height:100%;display:flex;align-items:center;justify-content:center;padding:0 9px;font-size:.6rem;font-weight:800;color:var(--txt-dim);cursor:pointer" onclick="viewAtt(\''+a.mediaId+'\',\''+a.mime+'\',\''+esc(a.name)+'\')">'+esc((a.name||'FILE').split('.').pop().toUpperCase())+'</div><button onclick="'+delJs+'">\u00d7</button></div>';
}
function attStripHtml(rec,coll){
  const atts=rec.atts||[];if(!atts.length)return '';
  return '<div class="photo-strip" style="margin-top:7px">'+atts.map((a,i)=>attCell(a,'delAtt(\''+coll+'\',\''+rec.id+'\','+i+')')).join('')+'</div>';
}
function stagedStripHtml(){
  if(!stagedAtts.length)return '';
  return '<div class="photo-strip" style="margin:0 0 9px">'+stagedAtts.map((a,i)=>attCell(a,'delStaged('+i+')')).join('')+'</div>';
}
async function fillAttThumbs(){
  for(const el of document.querySelectorAll('img[data-att]')){
    const u=await mediaUrl(el.getAttribute('data-att'));
    if(u)el.src=u;
  }
}
async function viewAtt(mid,mime,name){
  const u=await mediaUrl(mid);
  if(!u){toast('File data missing','err');return;}
  if((mime||'').startsWith('image/'))showLightbox(u);
  else{const a=document.createElement('a');a.href=u;a.download=name||'file';a.click();toast('Downloading '+(name||'file'));}
}
function delAtt(coll,id,idx){
  const rec=byId(state[coll],id);if(!rec||!rec.atts)return;
  const rm=rec.atts.splice(idx,1)[0];
  if(rm){idbDel(rm.mediaId).catch(()=>{});delete mediaCache[rm.mediaId];}
  touch(rec);save();renderTab();
}
function delStaged(i){
  const rm=stagedAtts.splice(i,1)[0];
  if(rm){idbDel(rm.mediaId).catch(()=>{});delete mediaCache[rm.mediaId];}
  renderTab();
}
function discardStaged(){
  while(stagedAtts.length){
    const a=stagedAtts.pop();
    idbDel(a.mediaId).catch(()=>{});delete mediaCache[a.mediaId];
  }
}

/* ===== Contact form ===== */
let formPhotoDataUrl=null, formPhotoRemoved=false;
function dynPhoneRow(p){p=p||{label:'Mobile',number:''};
  return '<div class="dyn-row" data-kind="phone"><select style="flex:0 0 108px">'+['Mobile','Home','Work','Other'].map(l=>'<option'+(p.label===l?' selected':'')+'>'+l+'</option>').join('')+'</select><input placeholder="Phone number" value="'+esc(p.number)+'"><button class="rm" onclick="this.parentNode.remove()">\u00d7</button></div>';}
function dynEmailRow(v){return '<div class="dyn-row" data-kind="email"><input placeholder="Email address" value="'+esc(v||'')+'"><button class="rm" onclick="this.parentNode.remove()">\u00d7</button></div>';}
function dynCustomRow(f){f=f||{k:'',v:''};
  return '<div class="dyn-row" data-kind="custom"><input placeholder="Field (e.g. Passport No.)" style="flex:0 0 44%" value="'+esc(f.k)+'"><input placeholder="Value" value="'+esc(f.v)+'"><button class="rm" onclick="this.parentNode.remove()">\u00d7</button></div>';}
function addDyn(wrapId,html){const d=document.createElement('div');d.innerHTML=html;$(wrapId).appendChild(d.firstChild);}

function openContactForm(id){
  const c=id?contactOf(id):null;
  formPhotoDataUrl=null;formPhotoRemoved=false;
  const gs=alive(state.groups);
  openSheet(
    '<h2>'+(c?'Edit contact':'New contact')+'</h2><p class="sheet-sub">Only the name is required \u2014 everything else is optional.</p>'
    +'<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">'
    +'<div class="ava" id="cf_ava" style="width:64px;height:64px;border-radius:18px;font-size:1.3rem;'+(c?avaStyle(c):'')+'" data-photo="'+(c&&c.photoId||'')+'">'+(c?esc(initials(c.name)):'\ud83d\udc64')+'</div>'
    +'<div><button class="btn btn-ghost btn-sm" onclick="$(\'profPhotoFile\').click()">\ud83d\udcf7 '+(c&&c.photoId?'Change photo':'Add photo')+'</button>'
    +(c&&c.photoId?' <button class="btn btn-ghost btn-sm" onclick="formPhotoRemoved=true;formPhotoDataUrl=null;$(\'cf_ava\').innerHTML=\'\ud83d\udc64\';toast(\'Photo will be removed\')">Remove</button>':'')+'</div></div>'
    +'<div class="field"><label>Name *</label><input id="cf_name" value="'+esc(c?c.name:'')+'" placeholder="Full name"></div>'
    +'<div class="field"><label>Phone numbers</label><div id="cf_phones">'+((c&&c.phones||[]).map(dynPhoneRow).join('')||dynPhoneRow())+'</div><button class="addline" onclick="addDyn(\'cf_phones\',dynPhoneRow())">+ Add phone</button></div>'
    +'<div class="field"><label>Email IDs</label><div id="cf_emails">'+((c&&c.emails||[]).map(dynEmailRow).join('')||'')+'</div><button class="addline" onclick="addDyn(\'cf_emails\',dynEmailRow())">+ Add email</button></div>'
    +'<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Date of birth</label><input type="date" id="cf_dob" value="'+esc(c&&c.dob||'')+'"></div>'
    +'<div class="field" style="flex:0 0 34%"><label>Blood group</label><select id="cf_blood">'+['','A+','A-','B+','B-','AB+','AB-','O+','O-'].map(b=>'<option'+((c&&c.bloodGroup)===b?' selected':'')+'>'+b+'</option>').join('')+'</select></div></div>'
    +'<div class="field"><label>Allergies / medical alerts</label><input id="cf_allergies" value="'+esc(c&&c.allergies||'')+'" placeholder="e.g. Penicillin, peanuts"></div>'
    +'<div class="field"><label>Address</label><textarea id="cf_address" style="min-height:56px">'+esc(c&&c.address||'')+'</textarea></div>'
    +'<div class="field"><label>Other things to remember</label><div id="cf_custom">'+((c&&c.custom||[]).map(dynCustomRow).join('')||'')+'</div><button class="addline" onclick="addDyn(\'cf_custom\',dynCustomRow())">+ Add field</button></div>'
    +(gs.length?'<div class="field"><label>Groups</label><div class="chips" id="cf_groups">'+gs.map(g=>'<button class="chip'+((c&&c.groupIds||[]).includes(g.id)?' on':'')+'" data-gid="'+g.id+'" onclick="this.classList.toggle(\'on\')"><span class="gdot" style="background:'+g.color+'"></span>'+esc(g.name)+'</button>').join('')+'</div></div>':'')
    +'<button class="btn btn-primary btn-block" style="margin-top:6px" onclick="saveContact(\''+(c?c.id:'')+'\')">Save contact</button>'
    +(c?'<button class="btn btn-danger btn-block" style="margin-top:10px" onclick="deleteContact(\''+c.id+'\')">Move to trash</button>':'')
  );
  fillAvatars($('sheetBody'));
}
function collectDyn(wrapId,kind){
  const out=[];
  ($(wrapId)?$(wrapId).querySelectorAll('.dyn-row[data-kind='+kind+']'):[]).forEach(r=>{
    const ins=r.querySelectorAll('input,select');
    if(kind==='phone'){const num=ins[1].value.trim();if(num)out.push({label:ins[0].value,number:num});}
    else if(kind==='email'){const v=ins[0].value.trim();if(v)out.push(v);}
    else{const k=ins[0].value.trim(),v=ins[1].value.trim();if(k||v)out.push({k,v});}
  });
  return out;
}
async function saveContact(id){
  const name=$('cf_name').value.trim();
  if(!name){toast('Name is required','err');return;}
  let c=id?contactOf(id):null;
  if(!c){c={id:uid(),created:now(),deleted:false,pinned:false,groupIds:[],photoId:null};state.contacts.push(c);}
  c.name=name;
  c.phones=collectDyn('cf_phones','phone');
  c.emails=collectDyn('cf_emails','email');
  c.custom=collectDyn('cf_custom','custom');
  c.dob=$('cf_dob').value||'';
  c.bloodGroup=$('cf_blood').value||'';
  c.allergies=$('cf_allergies').value.trim();
  c.address=$('cf_address').value.trim();
  const gw=$('cf_groups');
  if(gw)c.groupIds=[...gw.querySelectorAll('.chip.on')].map(b=>b.getAttribute('data-gid'));
  if(formPhotoRemoved&&c.photoId){idbDel(c.photoId).catch(()=>{});delete mediaCache[c.photoId];c.photoId=null;}
  if(formPhotoDataUrl){
    const mid=c.photoId||uid();
    await idbPut({id:mid,contactId:c.id,kind:'profile',dataUrl:formPhotoDataUrl,mime:'image/jpeg',name:'profile.jpg',ts:now()});
    mediaCache[mid]=formPhotoDataUrl;c.photoId=mid;
  }
  touch(c);save();closeSheet();renderAll();
  toast(id?'Contact updated':'Contact added','ok');
}
function deleteContact(id){
  const c=contactOf(id);if(!c)return;
  if(!confirm('Move '+c.name+' to trash? You can restore from Settings \u2192 Trash.'))return;
  c.deleted=true;touch(c);save();closeSheet();renderAll();toast('Moved to trash');
}
function togglePin(id){const c=contactOf(id);if(!c)return;c.pinned=!c.pinned;touch(c);save();viewContact(id);renderHome();}

/* ===== Profile view ===== */
let curId=null, curTab='info';
function counts(id){
  return {
    notes:alive(state.notes).filter(n=>n.contactId===id).length,
    proms:alive(state.promises).filter(p=>p.contactId===id&&!p.done).length,
    meds:alive(state.meds).filter(m=>m.contactId===id).length+alive(state.appts).filter(a=>a.contactId===id).length,
    docs:alive(state.docs).filter(d=>d.contactId===id).length,
    links:alive(state.links).filter(l=>l.aId===id||l.bId===id).length
  };
}
function viewContact(id,tab){
  const c=contactOf(id);if(!c||c.deleted)return;
  curId=id;curTab=tab||'info';
  const gs=(c.groupIds||[]).map(g=>byId(state.groups,g)).filter(g=>g&&!g.deleted);
  const n=counts(id);
  const ph=(c.phones||[])[0], em=(c.emails||[])[0];
  const qa=(IS_MOBILE&&!IS_DESK)?('<div class="qacts">'
    +(ph?'<a href="tel:'+esc(ph.number.replace(/\s/g,''))+'"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Call</a>':'')
    +(ph?'<a href="https://wa.me/'+ph.number.replace(/\D/g,'')+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>WhatsApp</a>':'')
    +(em?'<a href="mailto:'+esc(em)+'"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/></svg>Email</a>':'')
    +'</div>'):'';
  openSheet(
    '<div class="prof-head">'
    +'<div class="ava" data-photo="'+(c.photoId||'')+'" style="'+avaStyle(c)+'" '+(c.photoId?'onclick="mediaUrl(\''+c.photoId+'\').then(u=>u&&showLightbox(u))"':'')+'>'+esc(initials(c.name))+'</div>'
    +'<div style="flex:1;min-width:0"><div class="pn">'+esc(c.name)+'</div>'
    +'<div class="pr">'+[c.dob?fmtDate(c.dob)+(ageFrom(c.dob)!=null?' \u00b7 '+ageFrom(c.dob)+' yrs':''):'',c.bloodGroup?'\ud83e\ude78 '+esc(c.bloodGroup):''].filter(Boolean).join(' \u00b7 ')+'</div>'
    +'<div>'+gs.map(groupTag).join('')+'</div></div>'
    +'<button class="icon-btn" title="'+(c.pinned?'Unpin':'Pin')+'" onclick="togglePin(\''+id+'\')"><svg viewBox="0 0 24 24" '+(c.pinned?'fill="#f5b74a" stroke="#f5b74a"':'fill="none"')+'><path d="M12 2l2.9 6.6 6.6.6-5 4.4 1.5 6.4L12 16.9 6 20l1.5-6.4-5-4.4 6.6-.6z"/></svg></button>'
    +'<button class="icon-btn" title="Edit" onclick="openContactForm(\''+id+'\')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>'
    +'</div>'
    +qa
    +'<div class="ptabs">'
    +[['info','Info',''],['notes','Notes',n.notes],['proms','Promises',n.proms],['med','Medical',n.meds],['docs','Docs',n.docs],['links','Links',n.links]]
      .map(t=>'<button class="ptab'+(curTab===t[0]?' active':'')+'" onclick="viewContact(\''+id+'\',\''+t[0]+'\')">'+t[1]+(t[2]?'<span class="pill">'+t[2]+'</span>':'')+'</button>').join('')
    +'</div><div id="ptabBody"></div>'
  );
  renderTab();
  fillAvatars($('sheetBody'));
}
function renderTab(){
  const b=$('ptabBody');if(!b||!curId)return;
  if(curTab!=='notes')discardStaged();
  if(curTab==='info')b.innerHTML=tabInfo();
  else if(curTab==='notes'){b.innerHTML=tabNotes();fillAttThumbs();}
  else if(curTab==='proms'){b.innerHTML=tabPromises();fillAttThumbs();}
  else if(curTab==='med'){b.innerHTML=tabMedical();fillAttThumbs();}
  else if(curTab==='docs'){b.innerHTML=tabDocs();fillDocThumbs();}
  else if(curTab==='links')b.innerHTML=tabLinks();
}

/* ---- Info tab (fields + important dates) ---- */
function tabInfo(){
  const c=contactOf(curId);
  const rows=[];
  (c.phones||[]).forEach(p=>rows.push(['\u260e '+p.label,esc(p.number)]));
  (c.emails||[]).forEach(e=>rows.push(['\u2709 Email',esc(e)]));
  if(c.dob)rows.push(['Birthday',fmtDate(c.dob)+(ageFrom(c.dob)!=null?' ('+ageFrom(c.dob)+' yrs)':'')]);
  if(c.bloodGroup)rows.push(['Blood group',esc(c.bloodGroup)]);
  if(c.allergies)rows.push(['Allergies',esc(c.allergies)]);
  if(c.address)rows.push(['Address',esc(c.address).replace(/\n/g,'<br>')+' <button class="mini-del" style="color:var(--navy2)" title="Navigate" onclick="openExt(placeNavUrls('+JSON.stringify(c.address).replace(/"/g,'&quot;')+').nav)">\ud83e\udded Navigate</button>']);
  (c.custom||[]).forEach(f=>rows.push([esc(f.k),esc(f.v)]));
  const dates=alive(state.dates).filter(d=>d.contactId===curId);
  const places=alive(state.places).filter(p=>p.contactId===curId);
  return (rows.length?rows.map(r=>'<div class="inf-row"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>').join(''):'<div class="hint" style="padding:8px 2px">No details yet \u2014 tap the pencil to add.</div>')
    +'<div class="card-h" style="margin-top:16px"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Places</div>'
    +(places.map(p=>'<div class="file-row"><div class="file-info"><div class="file-name">'+esc(p.label)+' <span class="tier-badge tb-watch">'+esc(p.tag||'Other')+'</span></div><div class="file-meta">'+esc((p.query||'').length>64?(p.query.slice(0,64)+'\u2026'):p.query)+(p.note?'<br>'+esc(p.note):'')+'</div></div>'
      +'<div class="file-acts">'
      +'<button class="icon-btn" title="Open in Maps" onclick="openExt(placeNavUrls(byId(state.places,\''+p.id+'\').query).open)"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>'
      +'<button class="icon-btn" title="Navigate" onclick="openExt(placeNavUrls(byId(state.places,\''+p.id+'\').query).nav)"><svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></button>'
      +'<button class="icon-btn" title="Edit" onclick="openPlaceForm(\''+p.id+'\')"><svg viewBox="0 0 24 24"><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>'

/* ===== vCard (.vcf) import — repeatable, merges by phone ===== */
function parseVcf(text){
  const cards=[];
  const blocks=text.split(/BEGIN:VCARD/i).slice(1);
  for(let raw of blocks){
    raw=raw.split(/END:VCARD/i)[0];
    // unfold continuation lines (CRLF + space/tab)
    const lines=raw.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/).filter(Boolean);
    const c={name:'',phones:[],emails:[],dob:'',photo:null};
    for(const line of lines){
      const ci=line.indexOf(':');if(ci<1)continue;
      const head=line.slice(0,ci).toUpperCase(), val=line.slice(ci+1).trim();
      const prop=head.split(';')[0];
      if(prop==='FN'&&!c.name)c.name=val.replace(/\\,/g,',');
      else if(prop==='N'&&!c.name){const p=val.split(';');c.name=[p[1],p[0]].filter(Boolean).join(' ').trim();}
      else if(prop==='TEL'&&val){
        let label='Mobile';
        if(/HOME/i.test(head))label='Home';else if(/WORK/i.test(head))label='Work';else if(/CELL|MOBILE/i.test(head))label='Mobile';else label='Other';
        c.phones.push({label,number:val});
      }
      else if(prop==='EMAIL'&&val)c.emails.push(val);
      else if(prop==='BDAY'){
        let m=val.match(/^(\d{4})-?(\d{2})-?(\d{2})/);
        if(m)c.dob=m[1]+'-'+m[2]+'-'+m[3];
        else{m=val.match(/^--(\d{2})-?(\d{2})/);if(m)c.dob='1900-'+m[1]+'-'+m[2];}
      }
      else if(prop==='PHOTO'){
        if(/^data:image/i.test(val))c.photo=val;
        else if(/ENCODING=B|BASE64/i.test(head)){
          let type='jpeg';const tm=head.match(/TYPE=([A-Z]+)/i);if(tm)type=tm[1].toLowerCase();
          c.photo='data:image/'+type+';base64,'+val.replace(/\s/g,'');
        }
      }
    }
    if(c.name)cards.push(c);
  }
  return cards;
}
async function importVcf(text){
  const cards=parseVcf(text);
  if(!cards.length){toast('No contacts found in that file','err');return;}
  // index existing by normalized phone and by lowercase name
  const byPhone={},byName={};
  alive(state.contacts).forEach(c=>{
    (c.phones||[]).forEach(p=>{const k=normPhone(p.number);if(k)byPhone[k]=c;});
    byName[c.name.toLowerCase()]=c;
  });
  let added=0,updated=0;
  for(const vc of cards){
    let ex=null;
    for(const p of vc.phones){const k=normPhone(p.number);if(k&&byPhone[k]){ex=byPhone[k];break;}}
    if(!ex)ex=byName[vc.name.toLowerCase()]||null;
    if(ex){
      let changed=false;
      // merge phones (new numbers only)
      const have=new Set((ex.phones||[]).map(p=>normPhone(p.number)));
      vc.phones.forEach(p=>{const k=normPhone(p.number);if(k&&!have.has(k)){ex.phones=ex.phones||[];ex.phones.push(p);have.add(k);changed=true;}});
      const haveE=new Set((ex.emails||[]).map(e=>e.toLowerCase()));
      vc.emails.forEach(e=>{if(!haveE.has(e.toLowerCase())){ex.emails=ex.emails||[];ex.emails.push(e);haveE.add(e.toLowerCase());changed=true;}});
      if(vc.dob&&!ex.dob){ex.dob=vc.dob;changed=true;}
      if(vc.photo&&!ex.photoId){
        const durl=await compressImage(vc.photo);
        const mid=uid();await idbPut({id:mid,contactId:ex.id,kind:'profile',dataUrl:durl,mime:'image/jpeg',name:'vcf.jpg',ts:now()});
        mediaCache[mid]=durl;ex.photoId=mid;changed=true;
      }
      if(changed){touch(ex);updated++;}
    }else{
      const c={id:uid(),name:vc.name,phones:vc.phones,emails:vc.emails,dob:vc.dob,bloodGroup:'',allergies:'',address:'',custom:[],groupIds:[],pinned:false,photoId:null,created:now(),deleted:false};
      if(vc.photo){
        const durl=await compressImage(vc.photo);
        const mid=uid();await idbPut({id:mid,contactId:c.id,kind:'profile',dataUrl:durl,mime:'image/jpeg',name:'vcf.jpg',ts:now()});
        mediaCache[mid]=durl;c.photoId=mid;
      }
      touch(c);state.contacts.push(c);
      (c.phones||[]).forEach(p=>{const k=normPhone(p.number);if(k)byPhone[k]=c;});
      byName[c.name.toLowerCase()]=c;
      added++;
    }
  }
  save();renderAll();
  toast('Imported: '+added+' new \u00b7 '+updated+' updated','ok');
}

    +alive(state.places).filter(p=>p.contactId===cid&&p.tag==='Home').map(p=>kv('Location \u2014 '+esc(p.label),esc(p.query))).join('')
    +(c.custom||[]).map(f=>kv(esc(f.k),esc(f.v))).join('')

/* ---- Birthday report ---- */
function repBirthdays(){
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const rows=[];
  alive(state.contacts).forEach(c=>{if(c.dob){const d=parseDate(c.dob);const by=d.getFullYear();const turns=new Date().getFullYear()-by;rows.push({m:d.getMonth(),day:d.getDate(),label:c.name,sub:by>1900?('Turns '+turns+' \u00b7 born '+by):'Birthday'});}});
  alive(state.dates).filter(d=>d.recurring).forEach(dt=>{const c=contactOf(dt.contactId);if(!c||c.deleted)return;const d=parseDate(dt.date);const y0=d.getFullYear();const yrs=new Date().getFullYear()-y0;rows.push({m:d.getMonth(),day:d.getDate(),label:c.name,sub:dt.label+(y0>1900&&yrs>0?' \u00b7 '+yrs+' years':'')});});
  if(!rows.length){toast('No birthdays or recurring dates yet','err');return;}
  let html='<div class="pp"><h1>Birthdays &amp; anniversaries</h1><div class="pp-sub">Year at a glance \u00b7 '+rows.length+' dates</div>';
  for(let m=0;m<12;m++){
    const mr=rows.filter(r=>r.m===m).sort((a,b)=>a.day-b.day);
    if(!mr.length)continue;
    html+='<h3>'+MN[m]+'</h3><table>'+mr.map(r=>'<tr><td style="width:52px"><b>'+r.day+'</b></td><td>'+esc(r.label)+'</td><td style="color:#5a6b85">'+esc(r.sub)+'</td></tr>').join('')+'</table>';
  }
  openPrint(html+ppFoot()+'</div>');
}

/* ---- Expiry register ---- */
function repExpiry(){
  const rows=[];
  alive(state.docs).forEach(d=>{if(!d.expiry)return;const c=contactOf(d.contactId);if(!c||c.deleted)return;
    rows.push({days:daysUntil(d.expiry),who:c.name,what:d.title,type:d.dtype,when:d.expiry});});
  alive(state.dates).filter(d=>!d.recurring).forEach(dt=>{const c=contactOf(dt.contactId);if(!c||c.deleted)return;
    rows.push({days:daysUntil(dt.date),who:c.name,what:dt.label,type:'Deadline',when:dt.date});});
  if(!rows.length){toast('No expiries or deadlines recorded','err');return;}
  rows.sort((a,b)=>a.days-b.days);
  openPrint('<div class="pp"><h1>Expiry register</h1><div class="pp-sub">'+rows.length+' tracked items \u00b7 urgency-tiered</div>'
    +'<table><tr><th>Status</th><th>Person</th><th>Item</th><th>Type</th><th>Date</th></tr>'
    +rows.map(r=>'<tr><td>'+ptBadge(r.days)+'</td><td>'+esc(r.who)+'</td><td><b>'+esc(r.what)+'</b></td><td>'+esc(r.type)+'</td><td>'+fmtDate(r.when)+'</td></tr>').join('')
    +'</table>'+ppFoot()+'</div>');
}

  const cv=document.createElement('canvas');cv.width=cv.height=240;

  g.addColorStop(0,'hsl('+hue+',60%,62%)');g.addColorStop(1,'hsl('+((hue+50)%360)+',60%,38%)');

  cx.fillStyle='rgba(255,255,255,.92)';cx.font='900 96px system-ui';cx.textAlign='center';cx.textBaseline='middle';

}

  state.meds.push(
    D({contactId:amma.id,name:'Telmisartan 40 mg',dose:'1-0-0 before breakfast',notes:'BP',active:true}),

  toast('Demo data loaded \u2014 12 people','ok');
}

/* ===== Theme ===== */
function applyTheme(){document.body.classList.toggle('amoled',state.settings.theme==='amoled');}
function setTheme(on){state.settings.theme=on?'amoled':'navy';save();applyTheme();toast(on?'Pure black on':'Navy theme','ok');}

/* ===== Boot ===== */
(async function boot(){
  await loadState();
  applyTheme();
  nav('home',true);
  suiteHomeBtn();
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('prm-sw.js').catch(()=>{});
  }
})();
</script>
